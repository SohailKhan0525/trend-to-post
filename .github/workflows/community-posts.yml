name: Publish Founder and Builder Posts
on:
  workflow_dispatch:
  repository_dispatch:
    types: [post-next]
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/community-posts.yml']
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: x-text-original-queue
  cancel-in-progress: false
jobs:
  post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Preview strict writing style
        if: github.event_name == 'push'
        run: python -m app preview
      - name: Generate one due standalone post
        id: prepare
        run: python -m app prepare --start-now
      - name: Persist reservation before publishing
        if: steps.prepare.outputs.prepared == 'true'
        run: bash scripts/commit-state.sh
      - name: Publish standalone text once
        id: publish
        if: steps.prepare.outputs.prepared == 'true'
        run: python -m app publish
      - name: Persist confirmed publication
        if: always() && steps.publish.outputs.published == 'true'
        run: bash scripts/commit-state.sh
