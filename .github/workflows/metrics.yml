name: Measure Qofeno posts
on:
  workflow_dispatch:
    inputs:
      status_only:
        description: Read the Azure worker heartbeat and publication ledger from D1 only
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths: ['app/metrics.py', 'scripts/azure_status.py', '.github/workflows/metrics.yml']
permissions:
  contents: read
concurrency:
  group: qofeno-metrics
  cancel-in-progress: false
jobs:
  metrics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read the Azure worker heartbeat and latest decision from D1
        if: inputs.status_only || (github.event_name == 'push' && hashFiles('infra/azure-target.json') != '')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python -m scripts.azure_status
      - name: Read actual own-post performance
        if: ${{ !inputs.status_only }}
        env:
          QOFENO_LEDGER: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: python -m app metrics
