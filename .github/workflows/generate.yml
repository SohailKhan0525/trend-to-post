name: Generate X Trend Draft

on:
  workflow_dispatch:
    inputs:
      post_type:
        description: "Post style for a manual test run"
        required: true
        default: "question"
        type: choice
        options:
          - funny_ragebait
          - breaking_news
          - question
  schedule:
    - cron: "0 2,8,14,20 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: x-trend-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      X_TRENDS_LOCATION: worldwide
      TREND_LIMIT: "25"
      AI_DRAFT_COUNT: "1"
      LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$GEMINI_API_KEY" || { echo "Missing GEMINI_API_KEY"; exit 1; }
          test -n "$GEMINI_API_KEY_BACKUP" || { echo "Missing GEMINI_API_KEY_BACKUP"; exit 1; }
          test -n "$X_AUTH_TOKEN" || { echo "Missing X_AUTH_TOKEN"; exit 1; }
          test -n "$X_CT0" || { echo "Missing X_CT0"; exit 1; }

      - name: Select post style
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            POST_TYPE="${{ inputs.post_type }}"
          else
            case "${{ github.event.schedule }}" in
              "0 2 * * *") POST_TYPE="funny_ragebait" ;;
              "0 8 * * *") POST_TYPE="breaking_news" ;;
              "0 14 * * *") POST_TYPE="question" ;;
              "0 20 * * *") POST_TYPE="question" ;;
              *) echo "Unknown schedule: ${{ github.event.schedule }}"; exit 1 ;;
            esac
          fi
          echo "POST_TYPE=$POST_TYPE" >> "$GITHUB_ENV"
          echo "Selected post style: $POST_TYPE"

      - name: Collect trends and generate one new draft
        run: python -m app run --post-type "$POST_TYPE"

      - name: Commit generated draft and history
        shell: bash
        run: |
          if test -z "$(git status --porcelain -- posts/ state/)"; then
            echo "No new draft generated (duplicate or no content change)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/ state/
          git commit -m "content: generate X trend draft"
          git push
