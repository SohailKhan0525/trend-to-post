name: Generate X Trend Draft

on:
  workflow_dispatch:
    inputs:
      post_type:
        description: "Post style for a manual test run"
        required: true
        default: "question"
        type: choice
        options:
          - funny_ragebait
          - breaking_news
          - question
  schedule:
    - cron: "0 2 * * *"
      timezone: "Asia/Kolkata"
    - cron: "0 8 * * *"
      timezone: "Asia/Kolkata"
    - cron: "0 14 * * *"
      timezone: "Asia/Kolkata"
    - cron: "0 20 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: x-trend-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      X_TRENDS_LOCATION: worldwide
      TREND_LIMIT: "25"
      AI_DRAFT_COUNT: "1"
      LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$GEMINI_API_KEY" || { echo "Missing GEMINI_API_KEY"; exit 1; }
          test -n "$GEMINI_API_KEY_BACKUP" || { echo "Missing GEMINI_API_KEY_BACKUP"; exit 1; }
          test -n "$X_AUTH_TOKEN" || { echo "Missing X_AUTH_TOKEN"; exit 1; }
          test -n "$X_CT0" || { echo "Missing X_CT0"; exit 1; }

      - name: Run tests
        run: python -m pytest -q

      - name: Select post style
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            POST_TYPE="${{ inputs.post_type }}"
          else
            case "${{ github.event.schedule }}" in
              "0 2 * * *") POST_TYPE="funny_ragebait" ;;
              "0 8 * * *") POST_TYPE="breaking_news" ;;
              "0 14 * * *") POST_TYPE="question" ;;
              "0 20 * * *") POST_TYPE="question" ;;
              *) echo "Unknown schedule: ${{ github.event.schedule }}"; exit 1 ;;
            esac
          fi
          echo "POST_TYPE=$POST_TYPE" >> "$GITHUB_ENV"
          echo "Selected post style: $POST_TYPE"

      - name: Collect trends and generate one new draft
        run: python -m app run --post-type "$POST_TYPE"

      - name: Validate generated draft
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          from datetime import datetime, timedelta, timezone

          files = sorted(Path("posts").glob("*.md"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not files:
              raise SystemExit("No generated post file found.")

          text = files[0].read_text(encoding="utf-8")
          expected = os.environ["POST_TYPE"]
          match = re.search(r"\*\*Post type:\*\* (.+)", text)
          if not match or match.group(1).strip() != expected:
              raise SystemExit(f"Post type mismatch: expected {expected!r}")

          trend_match = re.search(r"\*\*Trend:\*\* (.+)", text)
          if not trend_match:
              raise SystemExit("Generated trend metadata is missing.")
          generated_trend = trend_match.group(1).strip()

          history_path = Path("state/content_history.json")
          if history_path.exists():
              import json
              history = json.loads(history_path.read_text(encoding="utf-8"))
              cutoff = datetime.now(timezone.utc) - timedelta(days=7)
              recent_same_trend = 0
              for item in history:
                  if str(item.get("trend", "")).strip().casefold() != generated_trend.casefold():
                      continue
                  raw_timestamp = str(item.get("generated_at", "")).strip()
                  try:
                      timestamp = datetime.fromisoformat(raw_timestamp.replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if timestamp.tzinfo is None:
                      timestamp = timestamp.replace(tzinfo=timezone.utc)
                  if timestamp >= cutoff:
                      recent_same_trend += 1
              if recent_same_trend > 1:
                  raise SystemExit(
                      f"Trend reuse detected within seven days: {generated_trend!r} "
                      f"appears {recent_same_trend} times in history."
                  )

          draft_match = re.search(r"\*\*Word count:\*\* (\d+).*?\n\*\*Character count:\*\* (\d+).*?\n\n\*\*Main post:\*\*\n\n(.+?)\n\n\*\*Reply word count:\*\* (\d+).*?\n\*\*Reply character count:\*\* (\d+).*?\n\n\*\*Second-account reply:\*\*\n\n(.+?)\n", text, re.S)
          if not draft_match:
              raise SystemExit("Generated post/reply metadata is missing.")

          words = int(draft_match.group(1))
          chars = int(draft_match.group(2))
          post = draft_match.group(3).strip()
          reply_words = int(draft_match.group(4))
          reply_chars = int(draft_match.group(5))
          reply = draft_match.group(6).strip()
          emojis = sum(c in "😂🤣😭😅💀🔥🤯😤🙃😈🚨" for c in post)

          if words != 17 or len(post.split()) != 17:
              raise SystemExit(f"Expected exactly 17 post words, got {words}: {post}")
          if chars > 280 or len(post) > 280:
              raise SystemExit(f"Post exceeds 280 characters: {len(post)}")
          if emojis != 1:
              raise SystemExit(f"Main post must contain exactly one emoji, got {emojis}: {post}")
          if expected == "breaking_news" and not post.startswith("Breaking news 🚨"):
              raise SystemExit("Breaking-news post must start with 'Breaking news 🚨'.")
          if expected == "question" and post.count("?") != 1:
              raise SystemExit("Question post must contain exactly one question mark.")
          if expected == "breaking_news" and "?" in post:
              raise SystemExit("Breaking-news post must not be a question.")
          if reply_words != 17 or len(reply.split()) != 17:
              raise SystemExit(f"Expected exactly 17 reply words, got {reply_words}: {reply}")
          if reply_chars > 280 or len(reply) > 280:
              raise SystemExit(f"Reply exceeds 280 characters: {len(reply)}")
          if any(c in "😂🤣😭😅💀🔥🤯😤🙃😈🚨" for c in reply):
              raise SystemExit("Second-account reply must not contain emojis.")
          PY

      - name: Verify trend cooldown before commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import re

          files = sorted(Path("posts").glob("*.md"), key=lambda p: p.stat().st_mtime, reverse=True)
          text = files[0].read_text(encoding="utf-8")
          trend_match = re.search(r"\*\*Trend:\*\* (.+)", text)
          if not trend_match:
              raise SystemExit("Generated trend metadata is missing.")
          trend = trend_match.group(1).strip().casefold()
          cutoff = datetime.now(timezone.utc) - timedelta(days=7)
          history = json.loads(Path("state/content_history.json").read_text(encoding="utf-8"))
          matches = 0
          for item in history:
              if str(item.get("trend", "")).strip().casefold() != trend:
                  continue
              try:
                  ts = datetime.fromisoformat(str(item.get("generated_at", "")).replace("Z", "+00:00"))
              except ValueError:
                  continue
              if ts.tzinfo is None:
                  ts = ts.replace(tzinfo=timezone.utc)
              if ts >= cutoff:
                  matches += 1
          if matches != 1:
              raise SystemExit(f"Trend cooldown violation: {trend!r} has {matches} recent history entries.")
          print(f"Trend cooldown verified: {trend}")
          PY

      - name: Commit generated draft and history
        shell: bash
        run: |
          if test -z "$(git status --porcelain -- posts/ state/)"; then
            echo "No new draft generated."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The generated post and history are created from this run's checkout.
          # Sync to the latest main before committing so concurrent/manual changes
          # do not create a rebase conflict in the append-only history JSON.
          GENERATED_POST="$(find posts -maxdepth 1 -type f -name '*.md' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          cp "$GENERATED_POST" /tmp/generated-post.md
          cp state/content_history.json /tmp/generated-history.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/generated-post.md "$GENERATED_POST"
          python - <<'PY'
          import json
          from pathlib import Path

          current_path = Path("state/content_history.json")
          generated_path = Path("/tmp/generated-history.json")

          def load(path):
              if not path.exists():
                  return []
              return json.loads(path.read_text(encoding="utf-8"))

          current = load(current_path)
          generated = load(generated_path)

          by_fingerprint = {}
          for item in current + generated:
              fingerprint = item.get("fingerprint")
              if fingerprint:
                  by_fingerprint[fingerprint] = item

          merged = list(by_fingerprint.values())[-1000:]
          current_path.parent.mkdir(parents=True, exist_ok=True)
          current_path.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git add posts/ state/content_history.json
          git commit -m "content: generate X trend draft"
          git push
