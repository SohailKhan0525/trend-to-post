name: Generate X Trend Draft

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate.yml"
      - "app/**"
      - "requirements.txt"
      - "tests/**"
  schedule:
    - cron: "17 2,8,14,20 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: x-trend-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      X_TRENDS_LOCATION: worldwide
      TREND_LIMIT: "25"
      AI_DRAFT_COUNT: "1"
      LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$GEMINI_API_KEY" || { echo "Missing GEMINI_API_KEY"; exit 1; }
          test -n "$GEMINI_API_KEY_BACKUP" || { echo "Missing GEMINI_API_KEY_BACKUP"; exit 1; }
          test -n "$X_AUTH_TOKEN" || { echo "Missing X_AUTH_TOKEN"; exit 1; }
          test -n "$X_CT0" || { echo "Missing X_CT0"; exit 1; }

      - name: Collect trends and generate one new draft
        run: python -m app run

      - name: Commit generated draft and history
        shell: bash
        run: |
          if git diff --quiet -- posts/ state/; then
            echo "No new draft generated (duplicate or no content change)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/ state/
          git commit -m "content: generate X trend draft"
          git push
