name: Post X Quote

on:
  workflow_dispatch:
  repository_dispatch:
    types: [post-next]

permissions:
  contents: write

concurrency:
  group: x-post-quote
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      X_AUTH_TOKEN: \${{ secrets.X_AUTH_TOKEN }}
      X_CT0: \${{ secrets.X_CT0 }}
      GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install X client
        run: python -m pip install -r requirements.txt

      - name: Sync latest state
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$X_AUTH_TOKEN" || { echo "Missing X_AUTH_TOKEN"; exit 1; }
          test -n "$X_CT0" || { echo "Missing X_CT0"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "Missing GEMINI_API_KEY"; exit 1; }

      - name: Run trend quote bot
        run: python -m app post

      - name: Commit bot state
        shell: bash
        run: |
          if test -z "$(git status --porcelain -- state/post_queue.json)"; then
            echo "No state change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/post_queue.json
          git commit -m "chore: update quote bot state"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "git push failed; refreshing main before retry $((attempt + 1))."
            git fetch origin main
            git rebase origin/main || {
              echo "Unable to rebase bot state onto origin/main."
              exit 1
            }
          done

          echo "Failed to push bot state after 3 attempts."
          exit 1
