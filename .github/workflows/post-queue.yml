name: Post X Queue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: x-post-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install X client
        run: python -m pip install -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$X_AUTH_TOKEN" || { echo "Missing X_AUTH_TOKEN"; exit 1; }
          test -n "$X_CT0" || { echo "Missing X_CT0"; exit 1; }

      - name: Post next queue item
        run: python -m app post

      - name: Commit queue state
        shell: bash
        run: |
          if test -z "$(git status --porcelain -- state/post_queue.json)"; then
            echo "No queue state change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/post_queue.json
          git commit -m "chore: advance X post queue"
          git push

      - name: Remove one-time push trigger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/post-queue.yml")
          text = path.read_text(encoding="utf-8")
          old = '''on:
  push:
    paths:
      - ".github/workflows/post-queue.yml"
  workflow_dispatch:
  schedule:
'''
          new = '''on:
  workflow_dispatch:
  schedule:
'''
          if old not in text:
              print("One-time push trigger already removed.")
          else:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          if test -z "$(git status --porcelain -- .github/workflows/post-queue.yml)"; then
            echo "No workflow cleanup needed."
            exit 0
          fi

          git add .github/workflows/post-queue.yml
          git commit -m "chore: remove one-time X post trigger"
          git push
