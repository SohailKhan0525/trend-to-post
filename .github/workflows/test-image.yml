name: Test Cloudflare Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Generate image for first eligible post
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import json
          from pathlib import Path

          from app.image_generation import generate_image, has_mention_tag

          queue = json.loads(Path("x.json").read_text(encoding="utf-8"))
          item = next(
              (entry for entry in queue if not has_mention_tag(entry)),
              None,
          )
          if item is None:
              raise SystemExit("No image-eligible queue item exists.")

          number = item["number"]
          sentence = str(item["sentence"]).strip()
          item_type = str(item.get("type", "")).strip()

          print(f"Testing Cloudflare image generation for queue item {number}.")
          print(f"Type: {item_type}")
          print(f"Sentence: {sentence}")

          source = asyncio.run(
              generate_image(sentence, item_type=item_type, seed=int(number))
          )
          output_dir = Path("test-output")
          output_dir.mkdir(parents=True, exist_ok=True)

          suffix = source.suffix or ".jpg"
          destination = output_dir / f"queue-{number}{suffix}"
          destination.write_bytes(source.read_bytes())
          source.unlink(missing_ok=True)

          print(f"Generated: {destination}")
          print("Queue state was not modified.")
          PY

      - name: Upload generated image
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-flux-test
          path: test-output/
          if-no-files-found: error
          retention-days: 7
