name: Generate Brand Drafts

on:
  workflow_dispatch:
  repository_dispatch:
    types: [brand-drafts]
  schedule:
    - cron: "5 0 * * *"

permissions:
  contents: write

concurrency:
  group: x-post-quote
  cancel-in-progress: false

jobs:
  brand-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install X client
        run: python -m pip install -r requirements.txt

      - name: Validate AI secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing CLOUDFLARE_API_TOKEN"
            exit 1
          }

      - name: Validate Python syntax
        run: python -m compileall -q app

      - name: Run company draft tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Generate five company originals
        id: brand_bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m app brand-drafts

      - name: Commit company draft state
        if: always() && steps.brand_bot.outcome != 'skipped'
        shell: bash
        run: |
          if test -z "$(git status --porcelain -- state/post_queue.json state/brand_drafts.md)"; then
            echo "No company draft state change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/post_queue.json state/brand_drafts.md
          git commit -m "chore: update company reply drafts"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "git push failed (attempt $attempt/5); fetching main before retry."
            sleep $((attempt * 3))
            if git fetch --no-tags origin main; then
              git rebase origin/main
            else
              echo "git fetch failed; retrying push loop."
            fi
          done

          echo "Failed to push company draft state after 5 attempts."
          exit 1
