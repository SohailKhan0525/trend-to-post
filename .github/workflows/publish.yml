name: Publish Qofeno on X
on:
  schedule:
    # Retry missed GitHub wake-ups; D1 still caps sends per half-hour window.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'app/editorial.py'
      - 'app/personality.py'
      - 'app/reply_writer.py'
      - 'app/sources.py'
      - 'app/movie_posts.py'
      - 'app/movie_lines.json'
      - 'app/movie_catalog.py'
      - 'app/reply_schedule.py'
      - 'app/store.py'
permissions:
  contents: read
  # A job-scoped token hands off to the next run when cron events are missed.
  actions: write
concurrency:
  group: x-text-original-queue
  # Deploy the new editor on a release push. The next runner reconciles D1
  # before sending. Ordinary scheduled and handoff runs wait their turn.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'SohailKhan0525/trend-to-post'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate the publisher before using live credentials
        run: python -m unittest discover -s tests -q
      - name: Publish with D1 history and hand off to the next GitHub run
        env:
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
          # Deployments exercise one cycle and its handoff; successors stay for 55 minutes.
          QOFENO_RUN_SECONDS: ${{ github.event_name == 'push' && '60' || '3300' }}
          QOFENO_POLL_SECONDS: ${{ github.event_name == 'push' && '60' || '600' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          QOFENO_AI_MODEL: ${{ vars.QOFENO_AI_MODEL }}
          DASH_RATTLE_MODEL: ${{ vars.DASH_RATTLE_MODEL }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: QOFENO_RELEASE="$(git rev-parse HEAD)" python -m app.workflow_runner --duration-seconds "$QOFENO_RUN_SECONDS" --interval-seconds "$QOFENO_POLL_SECONDS"
