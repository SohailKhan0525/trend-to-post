name: Deploy Qofeno's Azure worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/azure-target.json'
permissions: {}
concurrency:
  group: qofeno-azure-deploy
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'SohailKhan0525/trend-to-post'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      configured: ${{ steps.target.outputs.configured }}
      release: ${{ steps.target.outputs.release }}
      manifest: ${{ steps.target.outputs.manifest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the deployment target
        id: target
        run: python3 scripts/azure-deploy.py target
      - name: Show the public GitHub identity subject for Azure setup
        if: steps.target.outputs.configured != 'true'
        run: python3 scripts/azure-deploy.py subject
      - name: Look up the Central India public retail rates
        if: steps.target.outputs.configured != 'true'
        continue-on-error: true
        run: python3 scripts/azure-price.py --location centralindia --currency INR
      - name: Verify release belongs to main
        if: steps.target.outputs.configured == 'true'
        env:
          RELEASE: ${{ steps.target.outputs.release }}
        run: |
          git merge-base --is-ancestor "$RELEASE" origin/main
          git diff --quiet origin/main -- infra/azure-target.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.target.outputs.configured == 'true'
        with:
          python-version: '3.12'
      - if: steps.target.outputs.configured == 'true'
        run: python -m pip install -r requirements.txt && python -m unittest discover -s tests -q
      - name: Write settings only to the VM's dedicated vault
        if: steps.target.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          QOFENO_AI_MODEL: ${{ vars.QOFENO_AI_MODEL }}
          DASH_RATTLE_MODEL: ${{ vars.DASH_RATTLE_MODEL }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: python scripts/azure-deploy.py deliver
      - name: Wait for the same release to pass preflight on Azure
        if: steps.target.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          RELEASE: ${{ steps.target.outputs.release }}
        run: bash scripts/wait-for-server.sh --ready
  cutover:
    needs: prepare
    if: needs.prepare.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: x-text-original-queue
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE: ${{ needs.prepare.outputs.release }}
    steps:
      - name: Read current main after acquiring the publisher lock
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          persist-credentials: false
      - name: Confirm the target is still current
        env:
          MANIFEST: ${{ needs.prepare.outputs.manifest }}
        run: printf '%s  infra/azure-target.json\n' "$MANIFEST" | sha256sum --check --strict
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Transfer the latest ledger to D1 and verify the live server
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          python -m app server-status --ready --release "$RELEASE"
          python -m app seed-server --release "$RELEASE"
          bash scripts/wait-for-server.sh
